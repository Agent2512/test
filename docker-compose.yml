version: "3.9"

services:
  app:
    image: alpine:3.19
    container_name: demo-app
    command: sh -c "while true; do echo hello from app; sleep 10; done"
    restart: unless-stopped
    depends_on:
      - db
    networks:
      - backend

  db:
    image: postgres:16
    container_name: demo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: demo
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - backend

  adminer:
    image: adminer:latest
    container_name: demo-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    networks:
      - backend

  nginx:
    image: nginx:stable
    container_name: demo-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - backend

volumes:
  db_data:

networks:
  backend: